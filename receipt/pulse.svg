<svg xmlns="http://www.w3.org/2000/svg" width="840" height="272" viewBox="0 0 840 272" role="img" aria-labelledby="pt pd">
<title id="pt">Pulse: a year of contributions as an ECG</title>
<desc id="pd">One heartbeat per week for the last 53 weeks, 617 contributions in total, biggest week 158. Spikes are labelled with the public repo that got the most commits that week.</desc>
