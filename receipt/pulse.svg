  <pattern id="major" width="40" height="40" patternUnits="userSpaceOnUse" x="34" y="198">
    <path d="M40 0H0V40" fill="none" stroke="#e2a297" stroke-width="1"/>
  </pattern>
  <linearGradient id="tp" x1="0" y1="0" x2="0" y2="1">
